name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Android Platform Wrapper
        working-directory: flutter_app
        run: flutter create --org com.apscl --project-name apscl_maintenance_app .

      - name: Build Release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apscl-maintenance-log-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
